# CodeMender GitHub Action (composite)
#
# Used as a single step from a repository's own workflow:
#
#   - uses: actions/checkout@v4
#   - uses: ./.github/actions/codemender
#
# Executes CodeMender (cm-runner) remotely in Google Cloud Run Jobs:
# 1. Authenticates to Google Cloud via Workload Identity Federation (WIF).
# 2. Packages repository snapshot and dispatches to Cloud Run Job.
# 3. Stages findings report and posts/updates sticky PR summary comment.
# 4. Uploads report.sarif, report.md, and finding SARIF artifacts.
#
# Security boundary: GitHub tokens are used only by host steps below (posting
# PR comments). They are never passed into a cm-runner container (ADR-0003).

# Governing: docs/openspec/specs/tech/components/github/spec.md#req-0001
# Governing: docs/openspec/specs/tech/components/github/spec.md#req-0006
# Governing: docs/openspec/specs/tech/components/github/spec.md#req-0009
name: CodeMender
description: Run CodeMender (cm-runner) on pull requests via Cloud Run and report back on the PR.

inputs:
  gcp_project_id:
    description: >-
      Google Cloud project ID used by CodeMender (`GOOGLE_CLOUD_PROJECT`).
    required: true
  gcp_workload_identity_provider:
    description: >-
      Full Google Cloud Workload Identity Provider resource name
      (`projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>`).
    required: true
  gcp_service_account:
    description: >-
      Google Cloud service account email for Workload Identity Federation.
    required: true
  gcs_transit_bucket:
    description: >-
      GCS bucket used for transit storage and report staging in Cloud Run mode.
      If not provided, defaults to CODEMENDER_GCS_TRANSIT_BUCKET repo variable
      or codemender-reports-<project>.
    required: false
    default: ''
  cloud_run_job_name:
    description: >-
      Name of the Cloud Run Job to execute in Cloud Run mode. Defaults to
      CODEMENDER_CLOUD_RUN_JOB_NAME repo variable or 'codemender-runner'.
    required: false
    default: ''
  cloud_run_region:
    description: >-
      GCP region for Cloud Run Job. Defaults to CODEMENDER_GCP_REGION repo
      variable or 'us-central1'.
    required: false
    default: ''
  diff_workers:
    description: >-
      Number of concurrent workers for `cm-runner find-diff` (1..16).
    required: false
    default: '8'
  log_level:
    description: cm-runner log level (debug, info, warning, error). Logs go to the job log.
    required: false
    default: info
  fix:
    description: >-
      Whether CodeMender tries a fix for each finding and posts it on the PR.
    required: false
    default: 'true'
  max_parallel_fixes:
    description: >-
      Maximum number of `cm-runner fix` jobs running at the same time.
    required: false
    default: '4'
  artifact_retention_days:
    description: >-
      Number of days to retain the uploaded workflow artifacts: `report.sarif`,
      `report.md`, one SARIF file per finding and one patch per fix.
    required: false
    default: '3'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Governing: docs/openspec/specs/tech/components/github/spec.md#req-0001
    # Governing: docs/openspec/specs/tech/components/github/spec.md#req-0006
    - name: Install action dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        if [[ -d "${GITHUB_WORKSPACE:-}/packages/repohost" ]]; then
          PKG_DIR="${GITHUB_WORKSPACE}/packages"
        else
          PKG_DIR="$(cd "${ACTION_PATH}/../../../packages" && pwd)"
        fi
        python -m pip install --quiet \
          "${PKG_DIR}/artifactstore" \
          "${PKG_DIR}/codemender" \
          "${PKG_DIR}/launcher[cloudrun]" \
          "${PKG_DIR}/repohost[github]"

    - name: Pre-flight check
      id: preflight
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: cm-github --preflight

    - name: Authenticate to Google Cloud (WIF)
      if: steps.preflight.outputs.should_run == 'true'
      id: gcp_auth
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ inputs.gcp_project_id }}
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        service_account: ${{ inputs.gcp_service_account }}
        create_credentials_file: true

    - name: Run CodeMender
      if: steps.preflight.outputs.should_run == 'true'
      shell: bash
      env:
        CODEMENDER_BACKEND: "cloudrun"
        CODEMENDER_LOG_LEVEL: ${{ inputs.log_level }}
        CODEMENDER_DIFF_WORKERS: ${{ inputs.diff_workers }}
        CODEMENDER_FIX: ${{ inputs.fix }}
        CODEMENDER_MAX_PARALLEL_FIXES: ${{ inputs.max_parallel_fixes }}
        CODEMENDER_VERIFY_REPLY_ID: ${{ steps.preflight.outputs.verify_reply_id }}
        CODEMENDER_OUT_DIR: ${{ runner.temp }}/codemender-out-${{ github.run_id }}-${{ github.run_attempt }}
        GOOGLE_CLOUD_PROJECT: ${{ inputs.gcp_project_id }}
        GOOGLE_GHA_CREDS_PATH: ${{ steps.gcp_auth.outputs.credentials_file_path }}
        GCS_TRANSIT_BUCKET: ${{ inputs.gcs_transit_bucket }}
        CLOUD_RUN_JOB_NAME: ${{ inputs.cloud_run_job_name }}
        CLOUD_RUN_REGION: ${{ inputs.cloud_run_region }}
        GITHUB_TOKEN: ${{ github.token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: exec cm-github

    - name: Upload CodeMender report artifacts
      if: always() && steps.preflight.outputs.should_run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: codemender-report-pr-${{ github.event.pull_request.number || github.run_id }}
        path: |
          ${{ runner.temp }}/codemender-out-${{ github.run_id }}-${{ github.run_attempt }}/report.sarif
          ${{ runner.temp }}/codemender-out-${{ github.run_id }}-${{ github.run_attempt }}/report.md
          ${{ runner.temp }}/codemender-out-${{ github.run_id }}-${{ github.run_attempt }}/findings/*.sarif
          ${{ runner.temp }}/codemender-out-${{ github.run_id }}-${{ github.run_attempt }}/fixes/*.diff
          ${{ runner.temp }}/codemender-out-${{ github.run_id }}-${{ github.run_attempt }}/verified/*.sarif
        if-no-files-found: ignore
        retention-days: ${{ inputs.artifact_retention_days }}