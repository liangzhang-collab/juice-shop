name: CodeMender

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, cm-main]
  # Optional: uncomment to enable on-demand `@cm-runner verify` replies
  pull_request_review_comment:
    types: [created]
  workflow_call:
  workflow_dispatch:    

permissions:
  actions: read         # Read prior PR scan artifacts when verifying a finding
  contents: read        # Check out the target repository for diff scanning
  id-token: write       # Mint OIDC token for Google Cloud Workload Identity Federation
  packages: read        # Pull the cm-runner image from GHCR
  pull-requests: write  # Post / update the CodeMender PR comment, fixes, and verify replies
  statuses: write       # Set commit status for CodeMender Security Gate

jobs:
  codemender:
    uses: liangzhang-collab/codemender-runner/.github/workflows/cm-merge-scan.yml@main
    secrets: inherit